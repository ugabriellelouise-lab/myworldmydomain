<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <header>
    <h1>My World, My Domain</h1>
    <p><em>A welcome into my own mind. Not perfect, has uneven tiling but I promise you it's worth a stay.</em></p>
  </header>
  <nav><ul><li><a href="index.html">home</a></li><li><a href="about.html">about</a></li><li><a href="members.html">members</a></li><li><a href="me.html">me</a></li><li><a href="blog.html">blog</a></li><li><a href="contact.html" class="active">contact</a></li><li><button id="theme-toggle" type="button">dark mode</button></li></ul></nav>
  <main>
    <section id="contact">
      <h2>Contact Me</h2>
      <form action="#" method="post">
        <p>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name">
        </p>
        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email">
        </p>
        <p>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="5" cols="40"></textarea>
        </p>
        <p><button type="submit" class="btn">Send Message</button></p>
      </form>
    </section>
  </main>
